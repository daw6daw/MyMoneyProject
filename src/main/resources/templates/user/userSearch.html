<!DOCTYPE html>
<html lang="ru"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Поиск пользователя</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container py-4 d-flex justify-content-between align-items-center">
        <h1 class="mb-0">Поиск пользователя</h1>

    </div>
    <div class="container py-4 d-flex justify-content-between align-items-center">
        <form class="row g-3" method="POST" th:action="@{/user/search}" th:object="${userFormForSearch}">
            <div class="col-2">
                <label for="id" class="form-label">Id</label>
                <input th:field="*{id}" type="text" class="form-control" id="id" placeholder="id">
            </div>
            <div class="col-2">
                <label for="lastName" class="form-label">Фамилия</label>
                <input th:field="*{lastName}" type="text" class="form-control" id="lastName" placeholder="Петров">
            </div>
            <div class="col-2">
                <label for="firstName" class="form-label">Имя</label>
                <input th:field="*{firstName}" type="text" class="form-control" id="firstName" placeholder="Александр">
            </div>
            <div class="col-2">
                <label for="middleName" class="form-label">Отчество</label>
                <input th:field="*{middleName}" type="text" class="form-control" id="middleName" placeholder="Олегович">
            </div>
            <div class="col-2">
                <label for="email" class="form-label">Электронная почта</label>
                <input th:field="*{email}" type="email" class="form-control" id="email"
                       placeholder="petrovalex@mail.ru">
            </div>
            <div class="col-2">
                <label for="login" class="form-label">Логин</label>
                <div class="input-group">
                    <span class="input-group-text" id="inputGroupPrepend2">@</span>
                    <input th:field="*{login}" type="text" class="form-control" id="login"
                           aria-describedby="inputGroupPrepend2" placeholder="petrovalex83">
                </div>
            </div>
            <div class="col-2">
                <label for="number" class="form-label">Телефон</label>
                <!-- Изменено на type="tel" для корректного ввода телефонных номеров -->
                <input th:field="*{number}" type="tel" class="form-control" id="number" placeholder="+7 980 999 99 99"
                       minlength="12"
                       maxlength="12"
                       pattern="\+7[0-9]{10}"
                       title="Номер должен начинаться с +7 и содержать 11 цифр (например, +79879879898)">
            </div>
            <div class="col-2">
                <label for="role" class="form-label">Роль</label>
                <select th:field="*{role.id}" class="form-select" id="role">
                    <option value="2">User</option>
                    <option value="1">Admin</option>
                </select>

            </div>
            <div class="col-md-2">
                <label for="createdWhen" class="form-label">Дата регистрации</label>
                <!-- type="date" автоматически включает встроенный календарь -->
                <input th:field="*{createdWhen}" type="datetime-local" class="form-control" id="createdWhen">
            </div>
            <div class="col-2">
                <label for="updatedBy" class="form-label">Кем обновлён</label>
                <input th:field="*{updatedBy}" type="text" class="form-control" id="updatedBy"
                       placeholder="Кем обновлён">
            </div>

            <div class="col-md-2">
                <label for="updatedWhen" class="form-label">Дата обновления</label>
                <!-- type="date" автоматически включает встроенный календарь -->
                <input th:field="*{updatedWhen}" type="datetime-local" class="form-control" id="updatedWhen">
            </div>

            <div class="col-2">
                <label for="isDeleted" class="form-label">Удалён?</label>
                <select th:field="*{deleted}" class="form-select" id="isDeleted">

                    <option value="true">Удалён</option>
                    <option value="false">Не удалён</option>
                </select>

            </div>
            <div class="col-2">
                <label for="deletedBy" class="form-label">Кем удалён</label>
                <input th:field="*{deletedBy}" type="text" class="form-control" id="deletedBy" placeholder="Кем удалён">
            </div>

            <div class="col-md-2">
                <label for="deletedWhen" class="form-label">Дата удаления</label>
                <!-- type="date" автоматически включает встроенный календарь -->
                <input th:field="*{deletedWhen}" type="datetime-local" class="form-control" id="deletedWhen">
            </div>

            <div class="col-md-2">
                <label for="restoredWhen" class="form-label">Дата восстановления</label>
                <!-- type="date" автоматически включает встроенный календарь -->
                <input th:field="*{restoredWhen}" type="datetime-local" class="form-control" id="restoredWhen">
            </div>
            <!-- Кнопка отправки на всю ширину -->
            <div class="col-12 mt-4">
                <button class="btn btn-primary w-100" type="submit">Поиск</button>
            </div>

        </form>
    </div>

    <table class="table">
        <thead class="text-center align-middle">
        <tr>
            <th scope="col">Id</th>
            <th scope="col">Фамилия</th>
            <th scope="col">Имя</th>
            <th scope="col">Отчество</th>
            <th scope="col">Электронная почта</th>
            <th scope="col">Логин</th>
            <th scope="col">Телефон</th>
            <th scope="col">Роль</th>
            <th scope="col">Дата регистрации</th>
            <th scope="col">Кем обновлён</th>
            <th scope="col">Дата обновления</th>
            <th scope="col">Удалён?</th>
            <th scope="col">Кем удалён</th>
            <th scope="col">Дата удаления</th>
            <th scope="col">Дата восстановления</th>
        </tr>
        </thead>
        <tbody class="text-center align-middle">
        <tr th:each="user : ${users}">
            <td th:text="${user.getId()}"></td>
            <td th:text="${user.getLastName()}"></td>
            <td th:text="${user.getFirstName()}"></td>
            <td th:text="${user.getMiddleName()}"></td>
            <td th:text="${user.getEmail()}"></td>
            <td>
                <a class="user-link" th:href="'/user/allUsers/' + ${user.getId()}"
                   th:text="${user.getLogin()}">Логин</a>
            </td>

            <td th:text="${user.getNumber()}"></td>
            <td th:text="${user.getRole().getRoleName()}"></td>
            <td th:text="${#temporals.format(user.createdWhen, 'dd.MM.yyyy HH:mm')}"></td>
            <td th:text="${user.getUpdatedBy()}"></td>
            <td th:text="${#temporals.format(user.updatedWhen, 'dd.MM.yyyy HH:mm')}"></td>
            <td style="width: 130px;" class="text-center align-middle">
                <span th:text="${user.deleted}" th:class="${user.deleted} ? 'badge bg-danger' : ''"></span>
            </td>
            <td th:text="${user.getDeletedBy()}"></td>
            <td th:text="${#temporals.format(user.deletedWhen, 'dd.MM.yyyy HH:mm')}"></td>
            <td th:text="${#temporals.format(user.restoredWhen, 'dd.MM.yyyy HH:mm')}"></td>

        </tr>
        </tbody>
