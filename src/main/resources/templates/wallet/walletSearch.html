<!DOCTYPE html>
<html lang="ru"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Поиск кошелька</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container py-4 d-flex justify-content-between align-items-center">
        <h1 class="mb-0">Поиск кошелька</h1>

    </div>
    <div class="container py-4 d-flex justify-content-between align-items-center">
        <form class="row g-3" method="POST" th:action="@{/wallet/search}" th:object="${walletFormForSearch}">
            <div class="col-2">
                <label for="id" class="form-label">Id</label>
                <input th:field="*{id}" type="text" class="form-control" id="id" placeholder="id">
            </div>
            <div class="col-2">
                <label for="createdBy" class="form-label">Кем создан</label>
                <input th:field="*{createdBy}" type="text" class="form-control" id="createdBy"
                       placeholder="Кем создан">
            </div>
            <div class="col-md-2">
                <label for="createdWhen" class="form-label">Дата регистрации</label>
                <!-- type="date" автоматически включает встроенный календарь -->
                <input th:field="*{createdWhen}" type="datetime-local" class="form-control" id="createdWhen">
            </div>
            <div class="col-2">
                <label for="updatedBy" class="form-label">Кем обновлён</label>
                <input th:field="*{updatedBy}" type="text" class="form-control" id="updatedBy"
                       placeholder="Кем обновлён">
            </div>
            <div class="col-md-2">
                <label for="updatedWhen" class="form-label">Дата обновления</label>
                <!-- type="date" автоматически включает встроенный календарь -->
                <input th:field="*{updatedWhen}" type="datetime-local" class="form-control" id="updatedWhen">
            </div>
            <div class="row g-3 align-items-center mb-3">
                <!-- 1. Чекбокс "Искать везде" -->
                <div class="col-auto">
                    <div class="form-check">
                        <!-- Проверяем параметр через рабочий ${param.searchAllDeleted} -->
                        <input type="checkbox"
                               id="searchAllDeleted"
                               name="searchAllDeleted"
                               value="true"
                               th:checked="${param.searchAllDeleted != null && param.searchAllDeleted[0] == 'true'}"
                               class="form-check-input"
                               onchange="toggleSelectVisual(this.checked);" />
                        <label class="form-check-label fw-medium" for="searchAllDeleted">
                            Искать везде (True + False)
                        </label>
                    </div>
                </div>

                <!-- 2. Выпадающий список -->
                <div class="col-auto">
                    <select id="isDeletedSelect"
                            name="isDeletedParam"
                            class="form-select"
                            th:style="${param.searchAllDeleted != null && param.searchAllDeleted[0] == 'true'} ? 'pointer-events: none; background-color: #e9ecef; opacity: 0.7;' : ''">
                        <!-- Проверяем выбранный пункт через ${param.isDeletedParam} -->
                        <option value="false" th:selected="${param.isDeletedParam == null || param.isDeletedParam[0] == 'false'}">
                            Только активные (False)
                        </option>
                        <option value="true" th:selected="${param.isDeletedParam != null && param.isDeletedParam[0] == 'true'}">
                            Только удаленные (True)
                        </option>
                    </select>
                </div>
            </div>

            <!-- Маленький скрипт, который делает селект визуально заблокированным, но оставляет его кликабельным для формы -->
            <script th:inline="javascript">
                function toggleSelectVisual(isChecked) {
                    const select = document.getElementById('isDeletedSelect');
                    if (isChecked) {
                        select.style.pointerEvents = 'none';
                        select.style.backgroundColor = '#e9ecef';
                        select.style.opacity = '0.7';
                    } else {
                        select.style.pointerEvents = 'auto';
                        select.style.backgroundColor = '#fff';
                        select.style.opacity = '1';
                    }
                }
            </script>

            <div class="col-2">
                <label for="deletedBy" class="form-label">Кем удалён</label>
                <input th:field="*{deletedBy}" type="text" class="form-control" id="deletedBy" placeholder="Кем удалён">
            </div>
            <div class="col-md-2">
                <label for="deletedWhen" class="form-label">Дата удаления</label>
                <!-- type="date" автоматически включает встроенный календарь -->
                <input th:field="*{deletedWhen}" type="datetime-local" class="form-control" id="deletedWhen">
            </div>
            <div class="col-md-2">
                <label for="restoredWhen" class="form-label">Дата восстановления</label>
                <!-- type="date" автоматически включает встроенный календарь -->
                <input th:field="*{restoredWhen}" type="datetime-local" class="form-control" id="restoredWhen">
            </div>

            <div class="col-2">
                <label for="name" class="form-label">Название</label>
                <input th:field="*{name}" type="text" class="form-control" id="name" placeholder="name">
            </div>
            <div class="col-2">
                <label for="user" class="form-label">Логин владельца</label>
                <input th:field="*{user.login}" type="text" class="form-control" id="user" placeholder="Введите логин">
            </div>

            <!-- Кнопка отправки на всю ширину -->
            <div class="col-12 mt-4">
                <button class="btn btn-primary w-100" type="submit">Поиск</button>
            </div>

        </form>
    </div>

    <table class="table">
        <thead class="text-center align-middle">
        <tr>
            <th style="width: 50px;" scope="col">Id</th>
            <th style="width: 130px;" scope="col">Кем создан</th>
            <th style="width: 130px;" scope="col">Дата создания</th>
            <th style="width: 130px;" scope="col">Кем обновлён</th>
            <th style="width: 130px;" scope="col">Дата обновления</th>
            <th style="width: 130px;" scope="col">Удалён?</th>
            <th style="width: 130px;" scope="col">Кем удалён</th>
            <th style="width: 130px;" scope="col">Дата удаления</th>
            <th style="width: 130px;" scope="col">Дата восстановления</th>
            <th style="width: 130px;" scope="col">Логин пользователя</th>
            <th style="width: 130px;" scope="col">Название</th>
            <th style="width: 130px;" scope="col">Баланс</th>
        </tr>
        </thead>
        <tbody class="text-center align-middle">
        <tr th:each="wallet : ${wallets}">
            <td style="width: 50px;" th:text="${wallet.getId()}"></td>
            <td style="width: 130px;" th:text="${wallet.getCreatedBy()}"></td>
            <td style="width: 130px;" th:text="${#temporals.format(wallet.createdWhen, 'dd.MM.yyyy HH:mm')}"></td>
            <td style="width: 130px;" th:text="${wallet.getUpdatedBy()}"></td>
            <td style="width: 130px;" th:text="${#temporals.format(wallet.updatedWhen, 'dd.MM.yyyy HH:mm')}"></td>
            <td style="width: 130px;" class="text-center align-middle">
                <span th:text="${wallet.deleted}" th:class="${wallet.deleted} ? 'badge bg-danger' : ''"></span>
            </td>

            <td style="width: 130px;" th:text="${wallet.getDeletedBy()}"></td>
            <td style="width: 130px;" th:text="${#temporals.format(wallet.deletedWhen, 'dd.MM.yyyy HH:mm')}"></td>
            <td style="width: 130px;" th:text="${#temporals.format(wallet.restoredWhen, 'dd.MM.yyyy HH:mm')}"></td>
            <td style="width: 130px;">
                <a class="user-link" th:href="'/user/allUsers/' + ${wallet.getUser().getId()}"
                   th:text="${wallet.getUser().getLogin()}">Логин</a>
            </td>
            <td style="width: 130px;" th:text="${wallet.getName()}"></td>
            <td style="width: 130px;" th:text="${#numbers.formatDecimal(wallet.getBalance() / 100.0, 1, 2, 'POINT')}"></td>

        </tr>
        </tbody>
